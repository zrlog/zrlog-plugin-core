name: plugin release package
on:
  push:
    branches:
      - main
jobs:
  build:
    name: plugin relase package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    concurrency:
      group: deploy-on-${{ matrix.os }}-jar   # 同一个 group 的任务会排队执行
      cancel-in-progress: true # 取消前一个任务
    strategy:
      matrix:
        os: [ubuntu-latest]
        architecture: [ amd64 ]
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Check out shared build scripts
        uses: actions/checkout@v4
        with:
          repository: zrlog/zrlog-build
          ref: cffa4213ad4a03a315a73d280317c691d469f8e7
          path: .zrlog-build
          persist-credentials: false
      - name: Cache node modules admin
        uses: actions/cache@v3
        with:
          path: src/main/frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('src/main/frontend/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
      - name: Build with Maven
        run: bash .zrlog-build/scripts/plugin/core/package-jar.sh -DoutputDirectory=/tmp/download/plugin/core
      - name: Upload JAR
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SECRET_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_KEY }}
          ARTIFACT_BUCKET: ${{ secrets.BUCKET }}
          ARTIFACT_ENDPOINT: ${{ secrets.HOST }}
        run: bash .zrlog-build/scripts/plugin/upload-bin.sh /tmp/download plugin
