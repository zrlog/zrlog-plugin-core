name: Runtime regression

on:
  pull_request:
    paths:
      - src/main/java/**
      - src/test/java/**
      - src/main/frontend/**
      - pom.xml
      - .github/workflows/runtime-regression.yml
  workflow_dispatch:
    inputs:
      native_candidate:
        description: Also build a Linux Native engineering candidate without publishing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: yarn
          cache-dependency-path: src/main/frontend/yarn.lock
      - name: Validate and build frontend
        working-directory: src/main/frontend
        run: |
          yarn install --frozen-lockfile --non-interactive --network-timeout 60000
          yarn type-check
          CI=true yarn test --watchAll=false --runInBand
          BUILD_PATH=../resources/static CI=false yarn build
      - name: Test and build engineering JAR
        run: |
          bash bin/build-info.sh
          ./mvnw -B -ntp package
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          jar=pathlib.Path('target/plugin-core.jar')
          data={'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                'sha256':hashlib.sha256(jar.read_bytes()).hexdigest(),'bytes':jar.stat().st_size,
                'boundary':'Engineering JAR with frontend build; no deployment/publication.'}
          pathlib.Path('target/core-candidate.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: core-regression-evidence
          path: target/surefire-reports
      - uses: actions/upload-artifact@v6
        with:
          name: core-engineering-candidate
          path: |
            target/plugin-core.jar
            target/core-candidate.json

  lifecycle-platforms:
    name: Lifecycle regression (${{ matrix.os }}, GraalVM 25)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, macos-15-intel, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm
          cache: maven
          github-token: ${{ github.token }}
      - name: Exercise startup and cancellation on supported runtime platforms
        shell: bash
        run: ./mvnw -B -ntp -Dtest=PluginRuntimeStateServiceTest,HostSchedulerPluginIntegrationTest test
      - name: Repeat the cooperative cancellation regression
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            ./mvnw -B -ntp -Dtest=HostSchedulerPluginIntegrationTest#hostRefreshCancellationWaitsForCleanup test
            mkdir -p "target/lifecycle-repetitions/run-${attempt}"
            cp target/surefire-reports/* "target/lifecycle-repetitions/run-${attempt}/"
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: core-lifecycle-${{ matrix.os }}
          path: |
            target/surefire-reports
            target/lifecycle-repetitions

  native:
    if: github.event_name == 'workflow_dispatch' && inputs.native_candidate
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm
          cache: maven
          github-token: ${{ github.token }}
      - name: Build Native engineering candidate with the production packaging entry
        run: |
          bash -e bin/package-native-github.sh "$RUNNER_TEMP/core-candidate"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'core-candidate'
          binary = root / 'plugin-core-Linux-amd64.bin'
          receipt = dict(source_commit=subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                         sha256=hashlib.sha256(binary.read_bytes()).hexdigest(), bytes=binary.stat().st_size,
                         producer_run_id=os.environ['GITHUB_RUN_ID'], producer_attempt=os.environ['GITHUB_RUN_ATTEMPT'],
                         boundary='Raw Native engineering candidate; no artifact processing or publication; not distribution acceptance.')
          (root / 'core-candidate.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: core-native-regression-evidence
          path: target/surefire-reports
      - uses: actions/upload-artifact@v6
        with:
          name: core-native-engineering-candidate
          path: ${{ runner.temp }}/core-candidate
