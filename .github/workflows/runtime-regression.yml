name: Runtime regression

on:
  pull_request:
    paths:
      - src/main/java/**
      - src/test/java/**
      - src/main/frontend/**
      - pom.xml
      - .github/workflows/runtime-regression.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/main/frontend/package-lock.json
      - name: Validate and build frontend
        working-directory: src/main/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run type-check
          CI=true npm test -- --watchAll=false --runInBand
          BUILD_PATH=../resources/static CI=false npm run build
      - name: Test and build engineering JAR
        run: |
          bash bin/build-info.sh
          ./mvnw -B -ntp package
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          jar=pathlib.Path('target/plugin-core.jar')
          data={'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                'sha256':hashlib.sha256(jar.read_bytes()).hexdigest(),'bytes':jar.stat().st_size,
                'boundary':'Engineering JAR with frontend build; no deployment/publication.'}
          pathlib.Path('target/core-candidate.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: core-regression-evidence
          path: target/surefire-reports
      - uses: actions/upload-artifact@v6
        with:
          name: core-engineering-candidate
          path: |
            target/plugin-core.jar
            target/core-candidate.json
