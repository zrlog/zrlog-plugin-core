name: build release native
on:
  push:
    branches:
      - main
jobs:
  build:
    name: plugin relase package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    concurrency:
      group: deploy-on-${{ matrix.os }}-native   # 同一个 group 的任务会排队执行
      cancel-in-progress: true # 取消前一个任务

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04,ubuntu-24.04-arm,macos-15-intel,macos-15,windows-2022 ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out shared build scripts
        uses: actions/checkout@v4
        with:
          repository: zrlog/zrlog-build
          ref: cffa4213ad4a03a315a73d280317c691d469f8e7
          path: .zrlog-build
          persist-credentials: false
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm' # See 'Options' for all available distributions
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'

      - name: Cache node modules admin
        uses: actions/cache@v4
        with:
          path: src/main/frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('src/main/frontend/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Build binary
        id: package
        run: |
          bash .zrlog-build/scripts/plugin/core/package-native.sh /tmp/download/plugin/core
      - name: Process Linux binary
        if: runner.os == 'Linux'
        uses: zrlog/zrlog-build@5b539f9a93403c981b9e36554ffb8d3d3e7e8b33 # v1.0.1
        with:
          artifact-file: ${{ steps.package.outputs.artifact_file }}
          artifact-name: ${{ steps.package.outputs.artifact_name }}
          artifact-version: ${{ steps.package.outputs.artifact_version }}
          artifact-architecture: ${{ steps.package.outputs.artifact_architecture }}
          service-url: ${{ vars.ARTIFACT_SERVICE_URL }}
          service-token: ${{ secrets.ARTIFACT_SERVICE_TOKEN }}
      - name: Upload binary
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SECRET_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_KEY }}
          ARTIFACT_BUCKET: ${{ secrets.BUCKET }}
          ARTIFACT_ENDPOINT: ${{ secrets.HOST }}
        run: bash .zrlog-build/scripts/plugin/upload-bin.sh /tmp/download plugin
